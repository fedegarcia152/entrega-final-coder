<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>SELL CARS</title>
</head>
<body>
    <!-- parte superior de la pagina y Logo -->
    
    <header>
        <div class="header-content">
            <img class="logo" src="../img/Logo.jpg" alt="Logo de la compania">
        </div>

        
        
        <!-- Bootstraps header -->
        
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                <li class="nav-item"><a class="nav-link" href="../index.html">Home/Autos</a></li>
                <li class="nav-item"><a class="nav-link" href="pickup.html">Pickup</a></li>
                <li class="nav-item"><a class="nav-link" href="motos.html">Motos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nautica.html">Nautica</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <div>
                        <input class="input-sherch" type="text" placeholder="Busca tu vehiculo">
                    </div>
                </ul>
            </div>
        </div>
    </nav>

    </header>
    <!-- cuarpo de la pagina, elementos de busqueda e imagines -->
    <div class="main-father">
        <!-- Contiene los botones de filtros de busqueda -->
        <div>

            <main>
                
                <div class="filters-cars">
        
                    <nav class="filters">
                        <button class="filters-items">Años</button>
                        <select class="filters" name="Año" id="AÑo">
                            <option value="">2022</option>
                            <option value="">2023</option>
                            <option value="">2024</option>
                        </select>

                        <button class="filters-items">Marca</button><select class="fil" name="Año" id="AÑo">
                            <option value="">Ford</option>
                            <option value="">Peugeot</option>
                            <option value="">Toyota</option>
                        </select>

                        <button class="filters-items">Modelo</button>
                        <select class="fil" name="Año" id="AÑo">
                            <option value="">Focus</option>
                            <option value="">Fiesta</option>
                            <option value="">Corolla</option>
                        </select>

                        <button class="filters-items">Valor</button>
                        <select class="fil" name="Año" id="AÑo">
                            <option value="">20 millones</option>
                            <option value="">15 millones</option>
                            <option value="">12 millones</option>
                        </select>

                        <button class="filters-items">Kilometros</button>
                        <select class="filters" name="Año" id="AÑo">
                            <option value="">Okm</option>
                            <option value="">10.000 km</option>
                            <option value="">20.000 km</option>
                        </select>
                    </nav>
                </div>
        
                
            </main>
        </div>
    <!-- Contiene las imagenes de los vehiculos -->
        <div class="flex-container"">
            <div class="catalog">
                
                <div class="box ingreso"><img src="../img/concecionariomas.jpg" alt="muestras de lanchas">
                <p class="text-catalog">Muestras de lanchas</p>
                <p class="position">Nuevo Ingreso</p>
                </div>

                <div class="box"><img src="../img/jetkawa.jpg" alt="jet kawasaki">
                <p class="text-catalog">Jet kawasaki</p>
                </div>
                
                <div class="box ingreso"><img src="../img/jetyama.jpg" alt="jet Yamaha">
                <p class="text-catalog">Jet Yamaha</p>
                <p class="position">Nuevo Ingreso</p>
                </div>
                
                <div class="box"><img src="../img/mercury.jpg" alt="Motor Mercury">
                <p class="text-catalog">Motor Mercury</p>
                </div>
                
                <div class="box"><img src="../img/wakeboard.jpg" alt="tabla wake">
                <p class="text-catalog">Tabla wake</p>
                </div>
                
                <div class="box"><img src="../img/ski.jpg" alt="Ski Acuatico">
                <p class="text-catalog">Ski Acuatico</p>
                </div>
                
                
            
            </div>
            
        </div>
    </div>
    
<!-- pie de de paginas, contacto via mail y redes sociales -->
    <footer>
        <div class="container-footer">
            <P class="text-footer">SEGUINOS</P>
        </div>
        <div class="container-footer">
            <a href="https://web.whatsapp.com/"><img class="img-footer" src="../img/wpp.jpg" alt="whatsapp"></a>
            <a href="https://www.instagram.com/"><img class="img-footer" src="../img/insta.jpg" alt=""></a>
            <a href="https://www.facebook.com/"><img class="img-footer"src="../img/face.jpg" alt="facebook"></a>
        </div>
    </footer>
