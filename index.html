<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Bundle JS (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>SELL CARS</title>
</head>
<body>
    <!-- parte superior de la pagina y Logo -->
    
    <header>
        <div class="header-content">
            <img class="logo" src="../img/Logo.jpg" alt="Logo de la compania">
            
        </div>

        
        
        <!-- Bootstraps header -->
        
        
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home/Autos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./pages/pickup.html">Pickup</a>
                        </li>
                        <li class="nav-item">
                                <a class="nav-link" href="./pages/motos.html">Motos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./pages/nautica.html">Nautica</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./pages/nosotros.html">Nosotros</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Busca tu vehículo" aria-label="Search">
                    </form>
                </div>
            </div>
        </nav>


    </header>
    <!-- cuarpo de la pagina, elementos de busqueda e imagines -->
    <div class="main-father">
        <!-- Contiene los botones de filtros de busqueda -->
        <div>

            <main>
                
                <div class="filters-cars">
        
                    <nav class="filters">
                        <button class="filters-items">Años</button>
                        <select class="filters" name="Año" id="AÑo">
                            <option value="">2022</option>
                            <option value="">2023</option>
                            <option value="">2024</option>
                        </select>

                        <button class="filters-items">Marca</button><select class="fil" name="Año" id="AÑo">
                            <option value="">Ford</option>
                            <option value="">Peugeot</option>
                            <option value="">Toyota</option>
                        </select>

                        <button class="filters-items">Modelo</button>
                        <select class="fil" name="Año" id="AÑo">
                            <option value="">Focus</option>
                            <option value="">Fiesta</option>
                            <option value="">Corolla</option>
                        </select>

                        <button class="filters-items">Valor</button>
                        <select class="fil" name="Año" id="AÑo">
                            <option value="">20 millones</option>
                            <option value="">15 millones</option>
                            <option value="">12 millones</option>
                        </select>

                        <button class="filters-items">Kilometros</button>
                        <select class="filters" name="Año" id="AÑo">
                            <option value="">Okm</option>
                            <option value="">10.000 km</option>
                            <option value="">20.000 km</option>
                        </select>
                    </nav>
                </div>
        
                
            </main>
        </div>
    <!-- Contiene las imagenes de los vehiculos -->
        <div class="flex-container"">
            <div class="catalog">
                
                <div class="box ingreso"><img src="../img/fiesta.jpg" alt="Ford Fiesta">
                <p class="text-catalog">Ford Fiesta </p>
                <p class="position">Nuevo Ingreso</p>
                </div>

                <div class="box"><img src="../img/focus.jpg" alt="Ford Focus">
                <p class="text-catalog">Ford Focus</p>
                </div>
                
                <div class="box ingreso"><img src="../img/208.jpg" alt="Peugeot 208">
                <p class="text-catalog">Peugeot 208</p>
                <p class="position">Nuevo Ingreso</p>
                </div>
                
                <div class="box"><img src="../img/corolla.jpg" alt="Toyota corolla">
                <p class="text-catalog">Toyota Corolla</p>
                </div>
                
                <div class="box"><img src="../img/cruze.jpg" alt="Chevrolet cruze">
                <p class="text-catalog">Chevrolet Cruze</p>
                </div>
                
                <div class="box"><img src="../img/gol.jpg" alt="VW gol">
                <p class="text-catalog">VW Gol</p>
                </div>
                
                <div class="box"><img src="../img/cronos.jpg" alt="cronos">
                <p class="text-catalog">Fiat Cronos</p>
                </div>
                
                <div class="box"><img src="../img/onix.jpg" alt="Onix">
                <p class="text-catalog">Chevrolet Onix</p>
                </div>
            
            </div>
            
        </div>
    </div>
    
<!-- pie de de paginas, contacto via mail y redes sociales -->
    <footer>
        <div class="container-footer">
            <P class="text-footer">SEGUINOS</P>
        </div>
        <div class="container-footer">
            <a href="https://web.whatsapp.com/"><img class="img-footer" src="../img/wpp.jpg" alt="whatsapp"></a>
            <a href="https://www.instagram.com/"><img class="img-footer" src="../img/insta.jpg" alt=""></a>
            <a href="https://www.facebook.com/"><img class="img-footer"src="../img/face.jpg" alt="facebook"></a>
        </div>
    </footer>
</body>
</html>
